# [INPUT]: PR head SHA or pushed commit SHA; standalone preflight source and offline tests.
# [OUTPUT]: Verified source SHA, syntax checks and deterministic tests on a GitHub runner.
# [POS]: Isolated fork CI for the read-only host preflight; never connects to SV.
# [PROTOCOL]: Update .github/workflows/CLAUDE.md with workflow changes, then check CLAUDE.md.
# No runtime deployment or secrets.
name: Panda host preflight offline tests
on:
  push:
    branches:
      - feat/sv-claude-readonly-preflight-20261021
    paths:
      - 'skills/panda-host-preflight/**'
      - '.github/workflows/panda-host-preflight.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'skills/panda-host-preflight/**'
      - '.github/workflows/panda-host-preflight.yml'
permissions:
  contents: read
jobs:
  offline-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact submitted commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "Expected source SHA $EXPECTED_SHA, got $actual"
            exit 1
          fi
          echo "Verified source SHA $actual"
      - name: Print interpreter version (GitHub runner, not SV)
        run: python3 --version
      - name: Syntax validation
        run: |
          python3 -m py_compile skills/panda-host-preflight/scripts/preflight.py
          python3 -m py_compile skills/panda-host-preflight/tests/test_preflight.py
      - name: Offline tests (no network by default)
        env:
          PYTHONNOUSERSITE: '1'
        run: python3 -m unittest discover -s skills/panda-host-preflight/tests -v
